name: Manual Package

# 与上游十周年UI 的 manual-package.yml 同形：手动触发或在 issue 里发 `/package` 评论，
# 构建后把产物作为**工作流 artifact** 上传（不是 GitHub Release —— 建 Release 与传资产
# 仍然是人的动作，这样 CI 不会碰到已发布的版本）。
# Stars 的差别：dist/release/ 的 10 项发布资产（整包 + 七个分包 + 索引 + 说明）
# **每项一个独立 Artifact**（upload-artifact v7 + archive:false，单文件上传时 artifact
# 名就是文件名，下载直接得到原始文件，不再有"总 Artifact 再套一层 ZIP"的二次包装），
# 并把 sha256 清单与各 Artifact 的下载链接写进运行摘要，照着核对即可。

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: manual-package
  cancel-in-progress: true

jobs:
  package:
    name: Build package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        !github.event.issue.pull_request &&
        github.event.comment.body == '/package'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gates
        run: |
          pnpm run check:syntax
          pnpm test
          pnpm run verify:pack
          pnpm run verify:skins

      - name: Build
        run: pnpm build

      - name: Verify release artifacts
        run: pnpm run verify:release

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('dist/info.json','utf8')).version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check build output
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f dist/extension.js
          test -f dist/info.json
          test -d dist/src
          test -d dist/ui
          node -e "const i=JSON.parse(require('fs').readFileSync('dist/info.json','utf8')); if(i.version!==process.env.VERSION) process.exit(1)"
          # 9 项发布资产齐不齐：整包 + 索引 + 七个分包
          test -f "dist/release/十周年UI-Stars-${VERSION}-full.zip"
          test -f dist/release/module-index.json
          for id in baby card-skin codename decade mobile online yjcm; do
            test -f "dist/release/${id}-${VERSION}.zip" || { echo "缺 ${id}-${VERSION}.zip"; exit 1; }
          done
          # 目录里是 9 项发布资产 + 1 份 RELEASE-NOTES.md（说明文件也上传，方便对照 sha）
          node -e "const fs=require('fs');const n=fs.readdirSync('dist/release').length; if(n!==10){console.error('dist/release 应为 10 项（9 资产 + 说明），实际 '+n); process.exit(1)}"
          # 内置默认模块索引（P19）：运行时文件必须随 dist 发布，整包才会带上它
          test -f dist/modules/module-index.json
          cmp -s dist/release/module-index.json dist/modules/module-index.json || { echo "dist/modules 与 dist/release 的 module-index.json 不一致"; exit 1; }

      # 以下 10 个上传步骤：一个最终文件 = 一个独立 Artifact。
      # upload-artifact v7 的 archive:false 只收单文件，且 artifact 名直接取文件名
      # （name 参数会被忽略），所以下载得到的就是 build-release.mjs 的原始产物本身。
      - name: Upload full package
        id: up-full
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/十周年UI-Stars-${{ steps.version.outputs.version }}-full.zip
          if-no-files-found: error
          archive: false

      - name: Upload module baby
        id: up-baby
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/baby-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module card-skin
        id: up-card-skin
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/card-skin-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module codename
        id: up-codename
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/codename-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module decade
        id: up-decade
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/decade-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module mobile
        id: up-mobile
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/mobile-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module online
        id: up-online
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/online-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module yjcm
        id: up-yjcm
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/yjcm-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          archive: false

      - name: Upload module index
        id: up-index
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/module-index.json
          if-no-files-found: error
          archive: false

      - name: Upload release notes
        id: up-notes
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/RELEASE-NOTES.md
          if-no-files-found: error
          archive: false

      - name: Show package summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          URL_FULL: ${{ steps.up-full.outputs.artifact-url }}
          URL_BABY: ${{ steps.up-baby.outputs.artifact-url }}
          URL_CARD_SKIN: ${{ steps.up-card-skin.outputs.artifact-url }}
          URL_CODENAME: ${{ steps.up-codename.outputs.artifact-url }}
          URL_DECADE: ${{ steps.up-decade.outputs.artifact-url }}
          URL_MOBILE: ${{ steps.up-mobile.outputs.artifact-url }}
          URL_ONLINE: ${{ steps.up-online.outputs.artifact-url }}
          URL_YJCM: ${{ steps.up-yjcm.outputs.artifact-url }}
          URL_INDEX: ${{ steps.up-index.outputs.artifact-url }}
          URL_NOTES: ${{ steps.up-notes.outputs.artifact-url }}
        run: |
          url_for() {
            case "$1" in
              "十周年UI-Stars-${VERSION}-full.zip") printf '%s' "$URL_FULL" ;;
              "baby-${VERSION}.zip") printf '%s' "$URL_BABY" ;;
              "card-skin-${VERSION}.zip") printf '%s' "$URL_CARD_SKIN" ;;
              "codename-${VERSION}.zip") printf '%s' "$URL_CODENAME" ;;
              "decade-${VERSION}.zip") printf '%s' "$URL_DECADE" ;;
              "mobile-${VERSION}.zip") printf '%s' "$URL_MOBILE" ;;
              "online-${VERSION}.zip") printf '%s' "$URL_ONLINE" ;;
              "yjcm-${VERSION}.zip") printf '%s' "$URL_YJCM" ;;
              "module-index.json") printf '%s' "$URL_INDEX" ;;
              "RELEASE-NOTES.md") printf '%s' "$URL_NOTES" ;;
              *) printf '' ;;
            esac
          }
          {
            echo "## 十周年UI-Stars ${{ steps.version.outputs.version }} 打包完成"
            echo
            echo "共 **10 个独立 Artifact**：每个最终文件一个，不再有总 Artifact 的 ZIP 二次包装。"
            echo "每个 ZIP Artifact 都是 \`build-release.mjs\` 生成的最终发布 ZIP，artifact 名即文件名，下载直接得到原始文件（upload-artifact v7 \`archive: false\`），无需解包。"
            echo
            echo "产物为**工作流 artifact**（未创建 Release）。下载后逐项核对 sha256 再上传到 Release。"
            echo
            echo "| 文件（=Artifact 名） | 字节 | sha256 | 下载 |"
            echo "|---|---|---|---|"
            for f in dist/release/*; do
              name=$(basename "$f")
              link=$(url_for "$name")
              cell=""
              [ -n "$link" ] && cell="[打开](${link})"
              printf '| `%s` | %s | `%s` | %s |\n' "$name" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)" "$cell"
            done
            echo
            echo "模块源：扩展本体已内置 \`modules/module-index.json\`（默认直接使用，随扩展更新，无需配置）。"
            echo "如需自定义模块源，可填：\`https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ steps.version.outputs.version }}/module-index.json\`；点模块管理里的「恢复默认模块源」即回到内置索引。"
          } >> "$GITHUB_STEP_SUMMARY"
